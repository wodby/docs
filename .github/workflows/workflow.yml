name: Build docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: wodby/actions/setup-wodby-cli@v1
        with:
          api-key: ${{ secrets.WODBY_API_KEY }}
          app-service-id: "213641549303562"

      - name: Build docs
        run: |
          wodby ci run -i wodby/mkdocs -- \
            sh -c "mkdir sites && cd 1.0 && mkdocs build -d ../sites/1.0 && cd ../2.0 && mkdocs build -d ../sites/2.0"

      - name: Build image
        run: wodby ci build nginx -f Dockerfile

      - name: Release image
        run: wodby ci release nginx

      - name: Deploy
        run: wodby ci deploy nginx

      - name: Purge Cloudflare cache
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X DELETE "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
