name: Check agent documentation

on:
  pull_request:
    paths:
      - '2.0/**'
      - '1.0/mkdocs.yml'
      - 'scripts/**'
      - '.github/workflows/agent-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation tools
        run: python -m pip install mkdocs-material -r 2.0/requirements-agent-docs.txt
      - name: Check Markdown exports and documentation contracts
        run: |
          python -m unittest discover -s scripts
          python -m unittest discover -s 2.0/scripts -p 'test_agent_docs.py'
          python 2.0/scripts/check_agent_contract.py --live
